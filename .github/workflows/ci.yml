name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ATIS_ENV: development
  ATIS_WARMUP: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Import and route smoke test
        run: flask --app app routes
      - name: Run pytest
        run: python -m pytest

  migration-check:
    name: Migration check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/atis-ci-migration-${{ github.run_id }}.db
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run migrations on a fresh SQLite database
        run: flask --app app db upgrade
      - name: Verify current migration head
        run: flask --app app db current

  docker-smoke:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build Docker image
        run: docker build --pull -t atis-smoke:${{ github.sha }} .
