name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ATIS_ENV: development
  ATIS_WARMUP: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            requirements-dev.txt
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Import and route smoke test
        run: flask --app app routes
      - name: Run pytest with coverage
        # Fail the build if coverage regresses below the floor so the safety net
        # cannot silently erode. Raise the floor as coverage improves.
        run: python -m pytest --cov=. --cov-report=term --cov-fail-under=68

  migration-check:
    name: Migration check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/atis-ci-migration-${{ github.run_id }}.db
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            requirements-dev.txt
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run migrations on a fresh SQLite database
        run: flask --app app db upgrade
      - name: Verify current migration head
        run: flask --app app db current
      - name: Downgrade to base and re-upgrade (rollback round-trip)
        # Proves every migration's downgrade() actually works, so a bad deploy
        # can be rolled back instead of being a one-way door.
        run: |
          flask --app app db downgrade base
          flask --app app db upgrade

  migration-check-postgres:
    name: Migration check (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atis
          POSTGRES_PASSWORD: atis
          POSTGRES_DB: atis_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://atis:atis@localhost:5432/atis_ci
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            requirements-dev.txt
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run migrations on a fresh PostgreSQL database
        run: flask --app app db upgrade
      - name: Verify current migration head
        run: flask --app app db current

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit pinned dependencies for known CVEs
        # Audits the fully-pinned constraints file. Does not fail the build yet
        # (report-only) so a newly-disclosed CVE surfaces without blocking every
        # unrelated PR; flip `|| true` off once the queue is triaged.
        run: pip-audit -r constraints.txt --strict || true

  docker-smoke:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build Docker image
        run: docker build --pull -t atis-smoke:${{ github.sha }} .
      - name: Scan image for OS/library vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: atis-smoke:${{ github.sha }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "0"   # report-only for now; set to "1" to enforce
